<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="100%" stop-color="#131b31" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Glow Glow -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Vault Outer Frame -->
  <rect x="96" y="96" width="320" height="320" rx="70" fill="none" stroke="url(#iconGrad)" stroke-width="16" opacity="0.4" />

  <!-- Vault Body / Shield -->
  <path d="M 256 120 L 372 170 L 372 290 C 372 350 320 400 256 420 C 192 400 140 350 140 290 L 140 170 Z" fill="url(#iconGrad)" opacity="0.15" stroke="url(#iconGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Vault Dial / Lock Center -->
  <circle cx="256" cy="260" r="64" fill="#0b1020" stroke="url(#iconGrad)" stroke-width="12" />
  
  <!-- Lock Keyhole / Center Dot -->
  <circle cx="256" cy="250" r="14" fill="#22d3ee" />
  <path d="M 248 250 L 264 250 L 268 285 L 244 285 Z" fill="#22d3ee" />

  <!-- Security Checkmark / Accent Star -->
  <path d="M 230 258 L 248 276 L 286 230" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
</svg>
